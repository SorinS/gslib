# go-krb5's test krb5.conf (test/testdata/test_vectors.go), with MIT syntax corners added.
[libdefaults]
  default_realm = TEST.GOKRB5
  dns_lookup_realm = false
  dns_lookup_kdc = false
  ticket_lifetime = 24h
  forwardable = yes
  default_tkt_enctypes = aes256-cts-hmac-sha1-96
  default_tgs_enctypes = aes256-cts-hmac-sha1-96
  noaddresses = false

[realms]
 TEST.GOKRB5 = {
  kdc = 127.0.0.1:88
  kdc = 127.0.0.2:88
  admin_server = 127.0.0.1:749
  default_domain = test.krb5
 }
 SUB.TEST.GOKRB5 = {
  kdc = tcp/127.0.0.1:288
  kdc = [::1]:289
  kdc = fe80::1
  admin_server = 127.0.0.1:749
  default_domain = sub.test.gokrb5
 }

# comment
; another
[domain_realm]
 .test.krb5 = TEST.GOKRB5
 test.krb5 = TEST.GOKRB5
 .sub.test.gokrb5 = SUB.TEST.GOKRB5
 sub.test.gokrb5 = SUB.TEST.GOKRB5

[capaths]
 ANL.GOV = {
   TEST.ANL.GOV = .
   PNL.GOV = ES.NET
   NIH.GOV = ES.NET
 }
 TEST.ANL.GOV = {
   PNL.GOV = ANL.GOV
   PNL.GOV = ES.NET
 }

[appdefaults]*
  pam = {
    debug = "a \"quoted\"\tvalue"
    nested = {
      deep = 1
    }*
  }
