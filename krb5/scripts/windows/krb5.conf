# The client side, from a machine with ssh to the DC, after
#   ssh -N -L 8888:127.0.0.1:88 -L 3890:127.0.0.1:389 Administrator@<dc>
# ssh forwards TCP only, so the KDC is tcp/ (no UDP try).
[libdefaults]
    default_realm = GOOSE.TEST
    dns_lookup_kdc = false
    rdns = false
    udp_preference_limit = 1
    default_tkt_enctypes = aes256-cts-hmac-sha1-96 aes128-cts-hmac-sha1-96
    default_tgs_enctypes = aes256-cts-hmac-sha1-96 aes128-cts-hmac-sha1-96

[realms]
    GOOSE.TEST = {
        kdc = tcp/127.0.0.1:8888
    }

[domain_realm]
    .goose.test = GOOSE.TEST
    goose.test = GOOSE.TEST
